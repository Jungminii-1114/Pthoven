[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pthoven-vision"
version = "0.1.0"
description = "Pthoven B-01 session preparation and RGB hand calibration"
requires-python = ">=3.10"
dependencies = ["pthoven-tap>=0.1.0", "numpy>=1.24,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "mediapipe==0.10.21", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
pthoven-b01 = "pthoven_vision.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/pthoven-vision/web" = ["web/index.html", "web/style.css", "web/app.js", "web/practice.js", "web/practice-command.js"]
