[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pthoven-tap"
version = "0.1.0"
description = "Python fingertip trajectory and joint-angle tap candidate experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3"]

[project.scripts]
pthoven-tap = "pthoven_tap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
